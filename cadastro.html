<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biblioteca+ | Criar Cadastro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <!-- LOGO -->

            <a href="index.html" class="logo">
                BIBLIOTECA<span>+</span>
            </a>


            <!-- TÍTULO -->

            <h1>
                Criar cadastro
            </h1>

            <p class="muted">
                Crie sua conta para acessar a Biblioteca+.
            </p>


            <!-- FORMULÁRIO -->

            <form id="cadastroForm">


                <!-- NOME -->

                <label for="cadNome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="cadNome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                >


                <!-- E-MAIL -->

                <label for="cadEmail">
                    E-mail
                </label>

                <input
                    type="email"
                    id="cadEmail"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >


                <!-- TELEFONE -->

                <label for="cadTelefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="cadTelefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    autocomplete="tel"
                    required
                >


                <!-- SENHA -->

                <label for="cadSenha">
                    Senha
                </label>

                <input
                    type="password"
                    id="cadSenha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn primary full"
                >
                    CRIAR CADASTRO
                </button>


                <!-- MENSAGEM -->

                <p
                    id="cadMsg"
                    class="message"
                ></p>

            </form>


            <!-- LOGIN -->

            <div class="auth-bottom">

                Já possui uma conta?

                <br>

                <a href="login.html">
                    Fazer login
                </a>

            </div>


            <!-- VOLTAR -->

            <a
                href="index.html"
                class="back"
            >
                ← Voltar para o início
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="javascript.js"></script>

</body>

</html>
